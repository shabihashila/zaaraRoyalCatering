services:
  - type: web
    name: zrc
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSQL
      - key: Database__InitializeOnStartup
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Seed__SuperAdmin__Email
        sync: false
      - key: Seed__SuperAdmin__Password
        sync: false
