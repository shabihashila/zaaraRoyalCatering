services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zrc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ZRC_dev_12345!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - zrc-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ZRC_dev_12345!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Host/ZRC.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=ZRC;User Id=sa;Password=ZRC_dev_12345!;TrustServerCertificate=True"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"

volumes:
  zrc-sqldata:
